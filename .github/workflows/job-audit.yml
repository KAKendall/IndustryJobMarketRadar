name: Twice-weekly job audit
on:
  schedule:
    - cron: "0 13 * * 1,4"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_jobs.py
      - name: Open review issue when needed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Job audit needs review — ${new Date().toISOString().slice(0,10)}`;
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            if (!existing.data.some(issue => issue.title.startsWith('Job audit needs review'))) await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: 'One or more listed jobs could not be confirmed on the employer site. Run `python scripts/audit_jobs.py`, remove closed roles from `data/jobs.js`, and add newly verified roles from the employer watchlist.'});
